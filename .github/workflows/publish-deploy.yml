name: publish-deploy

# Dispatched by the CMS publish endpoint (repository_dispatch, event_type
# "cms-publish") after a story is published. Builds the static site from the
# published-content snapshot served by the Worker, then deploys it, then reports
# the outcome back to the Worker status endpoint.
#
# Requires GitHub + Cloudflare secrets (set in repository Settings → Secrets and
# variables → Actions). None exist in this repository yet; they are listed in
# docs/cms-publish-pipeline-design.md §12.

on:
  repository_dispatch:
    types: [cms-publish]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch published-content snapshot
        run: |
          mkdir -p .cms
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CMS_PIPELINE_TOKEN }}" \
            "${{ vars.CMS_SNAPSHOT_URL }}" \
            -o .cms/snapshot.json
          node -e "const s=require('./.cms/snapshot.json'); if(!Number.isInteger(s.revision)||!Array.isArray(s.stories)){console.error('invalid snapshot');process.exit(1)} console.log('snapshot revision', s.revision, '-', s.stories.length, 'stories')"

      - name: Report build start
        run: |
          REV="$(node -p "require('./.cms/snapshot.json').revision")"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CMS_PIPELINE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"revision\":$REV,\"status\":\"building\",\"buildId\":\"${{ github.run_id }}\"}" \
            "${{ vars.CMS_STATUS_URL }}" || echo "warning: could not report build start"

      - name: Build static site
        run: CMS_SNAPSHOT_FILE=.cms/snapshot.json npm run build

      - name: Deploy
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report deployment success
        if: success()
        run: |
          REV="$(node -p "require('./.cms/snapshot.json').revision")"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CMS_PIPELINE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"revision\":$REV,\"status\":\"deployed\",\"buildId\":\"${{ github.run_id }}\"}" \
            "${{ vars.CMS_STATUS_URL }}" || echo "warning: could not report deployment success"

      - name: Report deployment failure
        if: failure()
        run: |
          REV="$(node -p "require('./.cms/snapshot.json').revision" 2>/dev/null || echo 0)"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CMS_PIPELINE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"revision\":$REV,\"status\":\"failed\",\"buildId\":\"${{ github.run_id }}\",\"error\":\"build or deploy failed (run ${{ github.run_id }})\"}" \
            "${{ vars.CMS_STATUS_URL }}" || echo "warning: could not report deployment failure"