name: publish-deploy

# On-demand CI validation: builds from a checked-in snapshot fixture and runs
# the full test/typecheck/build/QA pipeline. No Cloudflare deploy, no live
# snapshot fetch, no secrets required.
#
# The actual public site does not deploy through CI at all — publishing a
# story only records that a revision is waiting; shipping it is a deliberate
# local step (`npm run cms:publish-pages`, then commit + push `.cms/` on
# main), which GitHub Pages then builds and serves via deploy-pages.yml.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CI_NODE_VERSION: '22'

jobs:
  ci-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build static site from CI snapshot fixture
        run: CMS_SNAPSHOT_FILE=.cms/fixtures/ci-snapshot.json npm run build

      - name: Verify static output
        run: node scripts/verify-dist.mjs .cms/fixtures/ci-snapshot.json

      - name: Install Playwright chromium for QA
        run: npx playwright install --with-deps chromium

      - name: Run QA suite + screenshots against preview
        run: |
          set -e
          npx astro preview --host 0.0.0.0 --port 4321 > /tmp/astro-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:4321/; then echo "preview up"; break; fi
            sleep 1
          done
          node scripts/qa.mjs
          node scripts/shots.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-publish-ci-dry-run
          path: dist
          if-no-files-found: error

      - name: CI DRY RUN COMPLETE
        run: |
          echo "=============================================="
          echo "CI DRY RUN COMPLETE"
          echo "=============================================="

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI dry run result"
            echo
            echo "- tests: ran"
            echo "- typecheck: ran"
            echo "- build: ran (CMS_SNAPSHOT_FILE fixture)"
            echo "- QA: ran"
            echo "- artifact: \`cms-publish-ci-dry-run\` (dist/)"
          } >> "$GITHUB_STEP_SUMMARY"